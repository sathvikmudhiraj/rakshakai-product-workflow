name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ai-service-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.14.1+cpu' 'torchvision==0.29.1+cpu'
      - run: python -m pip install -r ai-service/requirements.txt pip-audit
      - run: python -m pip check
      - run: python -m unittest discover -s ai-service/tests -p 'test_*.py'
      - run: python scripts/audit-ai-dependencies.py
  verify:
    needs: ai-service-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm run check
      - run: npm test
      - run: npm run frontend:build
      - run: npm audit --audit-level=moderate
      - run: npm --prefix backend audit --omit=dev --audit-level=moderate
      - run: npm --prefix frontend audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:critical-ux
      - run: npm run test:release
      - run: node --test backend/integration/postgres-tls.test.cjs
      - run: node --test backend/integration/backup-recovery.test.cjs
      - run: node --test backend/integration/operational-load.test.cjs
      - run: git diff --check
      - run: git diff --exit-code
