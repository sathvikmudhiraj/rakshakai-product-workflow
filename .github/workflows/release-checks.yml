name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm run check
      - run: npm test
      - run: npm run frontend:build
      - run: npm audit --audit-level=moderate
      - run: npm --prefix backend audit --omit=dev --audit-level=moderate
      - run: npm --prefix frontend audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
      - run: node --test backend/integration/postgres-tls.test.cjs
      - run: node --test backend/integration/backup-recovery.test.cjs
      - run: node --test backend/integration/operational-load.test.cjs
      - run: git diff --check
      - run: git diff --exit-code
