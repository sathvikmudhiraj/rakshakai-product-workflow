services:
  backend:
    environment:
      NODE_ENV: production
      CORS_ORIGIN: ${PRODUCTION_CORS_ORIGIN:?Set PRODUCTION_CORS_ORIGIN to the production frontend origin}
      FRONTEND_ORIGINS: ${PRODUCTION_FRONTEND_ORIGINS:?Set PRODUCTION_FRONTEND_ORIGINS to the production frontend origin}

  frontend:
    environment:
      CSP_ENV: production
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
      CSP_IMG_SRC: ${CSP_IMG_SRC:-}
    ports:
      - "${PRODUCTION_FRONTEND_PORT:-80}:8080"
