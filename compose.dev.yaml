services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  ai-service:
    ports:
      - "127.0.0.1:8000:8000"

  backend:
    environment:
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_ORIGINS: http://127.0.0.1:3000
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    environment:
      CSP_ENV: development
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
      CSP_IMG_SRC: ${CSP_IMG_SRC:-}
    ports:
      - "3000:80"
