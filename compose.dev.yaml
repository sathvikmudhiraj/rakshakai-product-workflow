services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

  ai-service:
    ports:
      - "127.0.0.1:${AI_SERVICE_HOST_PORT:-8000}:8000"

  backend:
    environment:
      NODE_ENV: development
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env.docker}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS in .env.docker}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-5000}:5000"

  frontend:
    environment:
      CSP_ENV: development
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
      CSP_IMG_SRC: ${CSP_IMG_SRC:-}
