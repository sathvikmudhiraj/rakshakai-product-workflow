# Use only with a unique `docker compose -p ...` project and fresh test credentials.
# This override keeps the browser endpoint on loopback and regional routing data read-only.
services:
  frontend:
    ports: !override
      - "127.0.0.1:${STAGING_VERIFY_PORT:-48123}:80"

  osrm:
    volumes: !override
      - ${OSRM_DATA_HOST_PATH:-./docker/osrm-data}:/data:ro
