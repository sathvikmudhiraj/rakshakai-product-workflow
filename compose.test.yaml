# Disposable release validation only. Never combine this file with deployment Compose files.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rakshakai_test_release
      POSTGRES_USER: release_test
      POSTGRES_PASSWORD: ${RELEASE_TEST_PASSWORD:?Generated by the release test runner}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release_test -d rakshakai_test_release"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &test-environment
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: postgresql://release_test:${RELEASE_TEST_PASSWORD}@postgres:5432/rakshakai_test_release
      PG_SSL_MODE: disable
      JWT_SECRET: ${RELEASE_TEST_JWT:?Generated by the release test runner}
      SEED_ADMIN_PASSWORD: ${RELEASE_TEST_PASSWORD}
      SEED_POLICE_PASSWORD: ${RELEASE_TEST_PASSWORD}
      SEED_CITIZEN_PASSWORD: ${RELEASE_TEST_PASSWORD}
      CORS_ORIGIN: ${RELEASE_TEST_ORIGIN:-https://release.example.invalid}
      FRONTEND_ORIGINS: ${RELEASE_TEST_ORIGIN:-https://release.example.invalid}
      EVIDENCE_STORAGE_DRIVER: filesystem
      EVIDENCE_STORAGE_DIR: /app/backend/storage/evidence
      AI_SERVICE_URL: ""
      GIS_ROUTING_PROVIDER: self_hosted
      OSRM_BASE_URL: http://127.0.0.1:1
      PUBLIC_OSRM_FALLBACK: "false"
      ROUTE_TIMEOUT_MS: "500"
      API_RATE_LIMIT: "100000"
      RAKSHAKAI_IMPORT_FILE: /app/backend/data/db.example.json
    command: ["sh", "-c", "npm run migrate && npm run import:json -- --if-empty && node server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - test-evidence:/app/backend/storage/evidence
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 40

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      CSP_ENV: production
    ports:
      - "127.0.0.1:${RELEASE_TEST_PORT:-0}:80"
    depends_on:
      backend:
        condition: service_healthy

  integration:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *test-environment
      RELEASE_TEST_PASSWORD: ${RELEASE_TEST_PASSWORD}
    volumes:
      - ./backend/integration:/app/backend/integration:ro
      - test-evidence:/app/backend/storage/evidence
    command: ["node", "--test", "--test-concurrency=1", "integration/release.test.cjs"]
    depends_on:
      frontend:
        condition: service_started

volumes:
  test-evidence:
